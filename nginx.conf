server {
    listen 80;
    server_name vericompliance.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vericompliance.ai;

    ssl_certificate /etc/letsencrypt/live/vericompliance.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vericompliance.ai/privkey.pem;

    # Enterprise Hardened Security Headers
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';";

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Rate Limiting & Timeouts
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}