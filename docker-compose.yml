version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vericompliance_db
    environment:
      POSTGRES_DB: vericompliance
      POSTGRES_USER: vericompliance_admin
      POSTGRES_PASSWORD: SecureProductionPassword123!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vericompliance_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vericompliance_backend
    environment:
      - DATABASE_URL=postgresql://vericompliance_admin:SecureProductionPassword123!@db:5432/vericompliance
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vericompliance_celery
    command: celery -A app.tasks.worker worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://vericompliance_admin:SecureProductionPassword123!@db:5432/vericompliance
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vericompliance_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  pgdata: